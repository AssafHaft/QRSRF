# Fly.io config — deploy with `fly launch` (keeps this file) then `fly deploy`.
app = "qrsrf"
primary_region = "fra"

[env]
  PORT = "3000"
  DATA_DIR = "/data"

# Persistent volume for the SQLite database.
[mounts]
  source = "qrsrf_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
